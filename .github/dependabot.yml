version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      desarrollo:
        dependency-type: development
      produccion:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # Subir de versión mayor de Node se decide a mano, junto con .nvmrc y engines.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
